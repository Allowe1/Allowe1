<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0C;--fg:#F3EFE6;--dim:#8C8779;--acc:#F2A23A;--acc2:#F26B1D;--line:rgba(242,162,58,.18)}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:520px;background:var(--bg);overflow:hidden}
.wrap{position:relative;width:1600px;height:520px;font-family:Inter,-apple-system,"Helvetica Neue",sans-serif;color:var(--fg);
 background:
  radial-gradient(900px 420px at 78% 50%, rgba(242,107,29,.18), transparent 60%),
  radial-gradient(600px 300px at 12% 100%, rgba(242,162,58,.10), transparent 60%),
  var(--bg)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;opacity:.35;mask-image:radial-gradient(1000px 500px at 70% 50%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(1000px 500px at 70% 50%,#000 30%,transparent 80%)}
.corner{position:absolute;width:44px;height:44px;border:2px solid var(--acc);opacity:.9}
.tl{top:36px;left:36px;border-right:0;border-bottom:0}.tr{top:36px;right:36px;border-left:0;border-bottom:0}
.bl{bottom:36px;left:36px;border-right:0;border-top:0}.br{bottom:36px;right:36px;border-left:0;border-top:0}
.mono{font-family:"JetBrains Mono",Menlo,monospace}
.tag{position:absolute;top:62px;left:96px;font-size:17px;letter-spacing:.22em;color:var(--acc);font-weight:500}
.tag b{display:inline-block;width:9px;height:9px;background:var(--acc2);border-radius:50%;margin-right:12px;vertical-align:1px;box-shadow:0 0 14px var(--acc2)}
h1{position:absolute;left:92px;top:118px;font-size:112px;line-height:.9;font-weight:800;letter-spacing:-.045em}
h1 span{color:var(--acc)}
.sub{position:absolute;left:96px;top:352px;font-size:28px;font-weight:500;color:#D9D4C7;letter-spacing:-.01em}
.sub em{font-style:normal;color:var(--fg);font-weight:600}
.meta{position:absolute;left:96px;bottom:60px;display:flex;gap:46px;font-size:15px;letter-spacing:.14em;color:var(--dim);font-weight:500}
.meta i{font-style:normal;color:var(--acc);margin-right:10px}
.hud{position:absolute;right:120px;top:50%;transform:translateY(-50%);width:520px;height:300px;}
.hud svg{width:100%;height:100%}
.readout{position:absolute;right:96px;top:62px;text-align:right;font-size:14px;letter-spacing:.18em;color:var(--dim);line-height:1.9}
.readout span{color:var(--acc)}
</style></head><body><div class="wrap">
<div class="grid"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="tag mono"><b></b>MED SCHOOL × STARTUP × AI</div>
<h1>Junha<br>Kim<span>.</span></h1>
<div class="sub">Med student running <em>three businesses</em>.</div>
<div class="meta mono"><div><i>01</i>FUNNOW KOREA</div><div><i>02</i>MEDA · VIKA</div><div><i>03</i>CLINIC WEB &amp; SEO</div></div>
<div class="hud"><svg viewBox="0 0 520 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2A23A" stop-opacity=".9"/><stop offset="1" stop-color="#F26B1D" stop-opacity=".9"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<!-- glasses -->
<g stroke="url(#g)" stroke-width="5" filter="url(#glow)">
<rect x="40" y="90" width="190" height="120" rx="34"/>
<rect x="290" y="90" width="190" height="120" rx="34"/>
<path d="M230 150 q30 -22 60 0"/>
<path d="M40 150 q-30 -10 -30 -40"/><path d="M480 150 q30 -10 30 -40"/>
</g>
<!-- left lens: reticle -->
<g stroke="#F2A23A" stroke-width="2.5" opacity=".85">
<circle cx="135" cy="150" r="34"/><circle cx="135" cy="150" r="12" fill="#F2A23A" opacity=".9"/>
<path d="M135 100v18M135 182v18M85 150h18M167 150h18"/>
</g>
<!-- right lens: data bars -->
<g fill="#F2A23A" opacity=".9">
<rect x="320" y="118" width="110" height="6" rx="3"/><rect x="320" y="134" width="70" height="6" rx="3"/>
<rect x="320" y="150" width="130" height="6" rx="3"/><rect x="320" y="166" width="50" height="6" rx="3"/>
<rect x="320" y="182" width="95" height="6" rx="3"/>
</g>
<!-- scanlines -->
<g stroke="#F2A23A" stroke-width="1" opacity=".18">
<path d="M48 110h174M48 130h174M48 170h174M48 190h174M298 110h174M298 130h174M298 170h174M298 190h174"/>
</g>
</svg></div>
</div></body></html>
